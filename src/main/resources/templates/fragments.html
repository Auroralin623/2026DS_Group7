<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <!-- Pick the theme before the page paints: the saved choice, otherwise the system setting. -->
    <script>
        (function () {
            var theme = null;
            try { theme = localStorage.getItem("theme"); } catch (e) {}
            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
            // Long lists start collapsed only when the "show all" button can work.
            document.documentElement.classList.add("js");
        })();
    </script>
    <title th:text="${title}">MovieFinder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Site header. path = current page (for the language links); active = search | compare | about. -->
<header th:fragment="siteHeader(path, active)" class="site-header">
    <a class="logo" th:href="@{/}">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="3" y="12" width="26" height="16" rx="2.5" class="logo-body"/>
            <path d="M3.5 6.5 L27 3 L28 9 L4.5 12.5 Z" class="logo-top"/>
            <path d="M8 6 L11 10.6 M14 5.1 L17 9.7 M20 4.2 L23 8.8" class="logo-stripes"/>
            <path d="M14 16.5 L19.5 20 L14 23.5 Z" class="logo-play"/>
        </svg>
        <span>MovieFinder</span>
    </a>
    <nav class="site-nav" th:attr="aria-label=#{nav.label}">
        <a th:href="@{/}" th:classappend="${active == 'search'} ? 'is-active'" th:text="#{nav.search}">Search</a>
        <a th:href="${q == null} ? @{/compare} : @{/compare(q=${q})}" th:classappend="${active == 'compare'} ? 'is-active'" th:text="#{nav.compare}">Compare</a>
        <a th:href="@{/about}" th:classappend="${active == 'about'} ? 'is-active'" th:text="#{nav.about}">About</a>
    </nav>
    <div class="header-tools">
    <button type="button" class="theme-toggle" id="theme-toggle" th:attr="aria-label=#{theme.toggle}" th:title="#{theme.toggle}">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <details class="lang-menu">
        <summary th:attr="aria-label=#{lang.aria}">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>
            </svg>
            <span th:text="${#locale.language == 'zh'} ? '中文' : 'EN'">EN</span>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </summary>
        <div class="lang-options">
            <a lang="en" th:href="${q == null} ? @{${path}(lang='en')} : @{${path}(q=${q},lang='en')}"
               th:classappend="${#locale.language != 'zh'} ? 'is-active'">English</a>
            <a lang="zh-Hant" th:href="${q == null} ? @{${path}(lang='zh')} : @{${path}(q=${q},lang='zh')}"
               th:classappend="${#locale.language == 'zh'} ? 'is-active'">中文</a>
        </div>
    </details>
    </div>
    <script>
        // Switch light/dark on click and remember the choice. Until then, follow the system setting.
        (function () {
            var root = document.documentElement;
            document.getElementById("theme-toggle").addEventListener("click", function () {
                var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
                root.setAttribute("data-theme", next);
                try { localStorage.setItem("theme", next); } catch (e) {}
            });
            if (window.matchMedia) {
                window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
                    var saved = null;
                    try { saved = localStorage.getItem("theme"); } catch (err) {}
                    if (saved !== "light" && saved !== "dark") {
                        root.setAttribute("data-theme", e.matches ? "dark" : "light");
                    }
                });
            }
        })();
    </script>

    <!-- Shown while a search is running: a real search reads every website, so it can take a while. -->
    <div class="loading" id="loading" role="status" aria-live="polite" hidden>
        <div class="loading-card">
            <svg class="loading-reel" viewBox="0 0 48 48" aria-hidden="true">
                <circle cx="24" cy="24" r="21" class="reel-rim"/>
                <circle cx="24" cy="24" r="3" class="reel-hole"/>
                <circle cx="24" cy="11" r="5" class="reel-hole"/><circle cx="35.3" cy="17.5" r="5" class="reel-hole"/>
                <circle cx="35.3" cy="30.5" r="5" class="reel-hole"/><circle cx="24" cy="37" r="5" class="reel-hole"/>
                <circle cx="12.7" cy="30.5" r="5" class="reel-hole"/><circle cx="12.7" cy="17.5" r="5" class="reel-hole"/>
            </svg>
            <p class="loading-title" th:text="#{loading.title}">Searching…</p>
            <p class="loading-note" th:text="#{loading.note}">MovieFinder is reading each website and its subpages. This can take up to a minute.</p>
        </div>
    </div>
    <script>
        // Show the waiting screen when a search starts: the search forms, and any link that runs a search.
        (function () {
            var loading = document.getElementById("loading");
            document.addEventListener("DOMContentLoaded", function () {
                document.body.appendChild(loading);
            });
            function show() {
                loading.hidden = false;
            }
            function runsSearch(link) {
                if (link.target === "_blank" || link.origin !== location.origin) {
                    return false;
                }
                var path = link.pathname.replace(/\/$/, "");
                var isSearchPage = /\/(search|compare)$/.test(path);
                return isSearchPage && new URLSearchParams(link.search).has("q");
            }
            document.addEventListener("submit", function (e) {
                if (e.target.matches && e.target.matches("form.search")) {
                    show();
                }
            });
            document.addEventListener("click", function (e) {
                if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) {
                    return;
                }
                var link = e.target.closest ? e.target.closest("a[href]") : null;
                if (link && runsSearch(link)) {
                    show();
                }
            });
            // Coming back with the browser's Back button restores the page as it was left.
            window.addEventListener("pageshow", function () {
                loading.hidden = true;
            });
        })();
    </script>
</header>

<!-- Search form. action = /search or /compare. -->
<form th:fragment="searchForm(action)" class="search" th:action="@{${action}}" method="get" role="search">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
    </svg>
    <label class="sr-only" for="q" th:text="#{search.label}">Search movies by theme</label>
    <input id="q" type="search" name="q" th:value="${q}" th:placeholder="#{search.placeholder}" autocomplete="off" required>
    <button type="button" class="search-clear" th:attr="aria-label=#{search.clear}" th:title="#{search.clear}"
            onclick="var i=this.form.elements.q;i.value='';i.focus();">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button type="submit" class="search-submit" th:text="#{search.button}">Search</button>
</form>

<!-- Pill link to the compare page. -->
<a th:fragment="compareLink(label)" class="pill-link" th:href="${q == null} ? @{/compare} : @{/compare(q=${q})}">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M12 4v16M7 20h10M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/>
    </svg>
    <span th:text="${label}">Compare with Tavily</span>
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
</a>

<!-- Button under a long list. total = number of items; visible = how many are shown before it is pressed. -->
<button th:fragment="showAll(total, visible)" type="button" class="show-all" th:if="${total > visible}"
        th:attr="data-visible=${visible}" th:text="#{result.showAll(${total})}"
        onclick="var list=this.previousElementSibling,first=list.children[this.dataset.visible];list.classList.remove('is-collapsed');this.remove();var a=first&amp;&amp;first.querySelector('a');if(a){a.focus();}">Show all 49 results</button>

<!-- External link icon. -->
<svg th:fragment="externalIcon" class="ext-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
</svg>

</body>
</html>
